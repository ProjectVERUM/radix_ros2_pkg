name: "Radix: Build and Push Image"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g. humble, test, v1.0.0)"
        required: true
        default: "humble"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
        # Checkout radix_ros2_pkg
      - name: Checkout radix_ros2_pkg
        uses: actions/checkout@v4
        with:
            path: ros2_ws/src/radix_ros2_pkg

      # Checkout radix_msgs_ros2_pkg
      - name: Clone radix_msgs_ros2_pkg
        run: |
            git clone https://x-access-token:${RADIX_MSGS_PAT}@github.com/ProjectVERUM/radix_msgs_ros2_pkg.git \
            ros2_ws/src/radix_msgs_ros2_pkg
        env:
            RADIX_MSGS_PAT: ${{ secrets.RADIX_MSGS_PAT }}

      # Enable Buildx (multi-arch + cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Avoid Docker naming rule violation
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ros2_ws
          file: ros2_ws/src/radix_ros2_pkg/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/radix_ros2_pkg:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
