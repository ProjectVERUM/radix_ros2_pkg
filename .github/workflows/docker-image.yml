name: Build and push Docker image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout radix_ros2_pkg
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/radix_ros2_pkg

      - name: Clone radix_msgs_ros2_pkg
        run: |
          git clone https://x-access-token:${RADIX_MSGS_PAT}@github.com/ProjectVERUM/radix_msgs_ros2_pkg.git \
            ros2_ws/src/radix_msgs_ros2_pkg
        env:
          RADIX_MSGS_PAT: ${{ secrets.RADIX_MSGS_PAT }}

      - name: Set lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/radix_ros2_pkg
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ros2_ws
          file: ros2_ws/src/radix_ros2_pkg/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
