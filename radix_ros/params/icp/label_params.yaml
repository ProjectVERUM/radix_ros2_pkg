# define shared parameters
params:
  # hit
  prob_hit: &prob_hit 0.55
  # miss
  prob_miss_default: &prob_miss_default 0.49
  prob_miss_moving: &prob_miss_moving 0.475
  prob_miss_stationary: &prob_miss_stationary 0.498

labels:
  # unlabeled (default)
  0:
    name: unlabeled
    color:
      r: 0
      g: 0
      b: 0
    prob_hit: *prob_hit
    prob_miss: *prob_miss_default
  # vehicle (may move)
